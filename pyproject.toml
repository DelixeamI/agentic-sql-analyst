[project]
name = "agentic-sql-analyst"
version = "0.1.0"
description = "Autonomous multi-agent Text-to-SQL analyst: LangGraph, sqlglot zero-trust sandbox, self-repair loop, Vega-Lite reports"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langgraph>=1.2.20",
    "openai>=3.49.0",
    "pydantic>=2",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.0",
    "sqlglot>=30.31.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
analyst = "agentic_sql_analyst.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: needs a real PostgreSQL (Docker / testcontainers)"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "BLE", "A", "C4", "SIM", "RUF", "ASYNC", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Cyrillic text in prompts/messages is intentional

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608"]
"src/agentic_sql_analyst/agents/nodes.py" = ["S101"]  # asserts document routing invariants
"src/agentic_sql_analyst/cli.py" = ["T201", "ASYNC240"]  # CLI writes report files once at the end
"src/agentic_sql_analyst/llm/demo_client.py" = ["S608"]  # constant demo SQL, no user input

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["agentic_sql_analyst"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "asyncpg.*", "vega.*"]
ignore_missing_imports = true
